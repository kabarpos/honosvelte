name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (OPS-05) — tags can be moved/compromised.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Smoke-test the multi-stage Dockerfile (non-root runtime + bun
      # healthcheck) — build only, no registry push.
      - name: Build image
        run: docker build -t honosvelte:ci .
      - name: Boot + readiness probe
        run: |
          docker run -d --name hs-ci -p 4311:4000 \
            -e APP_URL=http://localhost:4311 \
            honosvelte:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4311/health/ready; then
              echo "readiness OK"
              exit 0
            fi
            sleep 2
          done
          echo "readiness timed out"
          docker logs hs-ci
          exit 1
      - name: Tear down
        if: always()
        run: docker rm -f hs-ci
